# Gradle build optimization properties

# Enable build cache (caches task outputs for reuse)
org.gradle.caching=true

# Enable parallel execution (executes independent tasks in parallel)
org.gradle.parallel=true

# Configuration cache disabled due to incompatibility with custom tasks
# Can be re-enabled after migrating tasks to be configuration cache compatible
# org.gradle.configuration-cache=true

# Enable configuration on demand (only configures relevant projects)
org.gradle.configureondemand=true

# Increase JVM heap size for Gradle daemon
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Enable daemon (keeps Gradle running in background for faster builds)
org.gradle.daemon=true
