name: Build
on:
  push:
    branches:
      - main
      - test
      - dcs_clone
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  # required for all workflows
  security-events: write
  # required to fetch internal or private CodeQL packs
  packages: read
  contents: read
  actions: read # Required for private repositories

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: java-kotlin
          build-mode: manual # 'none' only analyzes Java; Kotlin needs a real build to be extracted.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK for Build
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Install mmtc-webapp-ui dependencies
        if: matrix.language == 'java-kotlin'
        working-directory: mmtc-webapp-ui/mmtc-webapp-ui
        run: pnpm install --frozen-lockfile

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3 # v3
        with:
          #config-file: ./.github/workflows/codeql/codeql-config.yml
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality, security-extended
          # If you wish to specify custom queries, you can do so here or in a config file.
          # By default, queries listed here will override any specified in a config file.
          # Prefix the list here with "+" to use these queries and those in the config file.
          # queries: ./path/to/local/query, your-org/your-repo/queries@main
          
      
      
      # If the analyze step fails for one of the languages you are analyzing with
      # "We were unable to automatically build your code", modify the matrix above
      # to set the build mode to "manual" for that language. Then modify this step
      # to build your code.
      # ℹ️ Command-line programs to run using the OS shell.
      # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
      - name: Build with Gradle
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          ./gradlew build

      - name: CodeQL Scan
        uses: github/codeql-action/analyze@v4 # v4

      # This step is required to remove malformed data from the CodeQL output
      # It may be possible to remove in future iterations
      - name: Post-Process Output
        run: |
          python3 -m pip install nasa-scrub

          results_dir=`realpath ${{ github.workspace }}/../results`
          sarif_files=`find $results_dir -name '*.sarif'`
          workspace_path="${{ github.workspace }}"

          ls -lh $results_dir/*.sarif

          for sarif_file in $sarif_files
          do
            output_file="$results_dir/$(basename $sarif_file .sarif)_stripped.sarif"

            python3 -m scrub.tools.parsers.translate_results $sarif_file $output_file ${{ github.workspace }} sarifv2.1.0
          done

          echo "RESULTS_DIR=$results_dir" >> $GITHUB_ENV
          echo "Results generated: "
          echo $results_dir

      # This step makes the analysis artifacts available for download
      # This can be helpful for debugging and archive purposes
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: codeql-artifacts
          path: ${{ env.RESULTS_DIR }}

      # Download SARIF files for Sonar scan
      - name: Download SARIF Files
        uses: actions/download-artifact@v5.0.0
        with:
          name: codeql-artifacts
          path: codeql-artifacts-for-sonar/

      - name: Verify downloaded SARIF files
        run: pwd; ls -R codeql-artifacts-for-sonar/

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./gradlew build sonar
          -Dsonar.verbose=true
          -Dsonar.organization=johnnylu-jpl-testenv
          -Dsonar.projectKey=johnnylu-jpl_MMTC